name: Precompute & Deploy India Nowcast to GitHub Pages

on:
  schedule:
    # Run hourly at minute 7 to avoid top-of-hour API congestion
    - cron: '7 * * * *'
  workflow_dispatch:

# Permissions required to deploy to GitHub Pages without commits
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  precompute-and-deploy:
    name: Generate Datasets & Publish to Pages CDN
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Spatial Precomputation
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          python scripts/precompute.py --output-dir public_pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: backend/public_pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
