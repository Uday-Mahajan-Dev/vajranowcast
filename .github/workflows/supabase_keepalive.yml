name: Supabase Free Tier Keep-Alive & Retention Cleanup

on:
  schedule:
    # Run every 3 days at 00:00 UTC to prevent project pausing and clean retention
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Keep-Alive Ping & Data Retention
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Supabase Maintenance
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/supabase_maintenance.py
